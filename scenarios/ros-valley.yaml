# Hero scenario: the brief's own example, done properly.
# Ros river valley near Korsun-Shevchenkivskyi, 3 Nov 2026, dusk (sunset ~14:31 UTC), light westerly.
# t = seconds after start. Timeline:
#   0-900     farmer's Mavic (neutral) works the fields, broadcasting honest Remote ID
#   102-      hostile Mavic passes the brief's example truth point at ~14:02:07Z (t=427)
#   300-      friendly recon Mavic patrols near RF1; Russian EW spoofs its GNSS 1250-1500
#   600-      goose flock crosses the valley (clutter for eyes and ears)
#   900-      fiber-optic FPV creeps up the valley at 10 m: RF-silent
#   1700-     Shahed crosses at 1,200 m; its modem leaks the odd LTE burst
#   1795-     analog FPV + ELRS; 2.4 GHz barrage jammer 1850-1970 (868 MHz control survives it)
#   ~2300     the FPV hits RF2's mast: RF2 goes dark
